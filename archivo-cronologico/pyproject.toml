[project]
name = "hj-archivo"
version = "0.1.0"
description = "Hermanos Jiménez 2004 S.L. – Automatización del archivo cronológico de residuos"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "PyMuPDF>=1.24",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "Pillow>=10.0",
  "pytesseract>=0.3.10",
  "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
