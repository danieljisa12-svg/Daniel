# Catálogo de códigos LER (Lista Europea de Residuos, Decisión 2014/955/UE).
# Subconjunto inicial: capítulo 17 (construcción y demolición) y códigos
# frecuentes en obra. Las descripciones son las oficiales abreviadas.
# IMPORTANTE: la descripción que la empresa usa en la columna F del archivo
# cronológico puede ser distinta; esa equivalencia se configura aparte
# (config/equivalencias_ler.yaml) y NO se deduce de este catálogo.
# Revisar contra el texto oficial antes del uso en producción.
