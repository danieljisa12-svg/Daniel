# Operaciones de tratamiento (Ley 7/2022, anexos II y III). Descripciones abreviadas.
R1: "Utilización principal como combustible u otro modo de producir energía"
R2: "Recuperación o regeneración de disolventes"
R3: "Reciclado o recuperación de sustancias orgánicas que no se utilizan como disolventes"
R4: "Reciclado o recuperación de metales y de compuestos metálicos"
R5: "Reciclado o recuperación de otras materias inorgánicas"
R6: "Regeneración de ácidos o de bases"
R7: "Valorización de componentes utilizados para reducir la contaminación"
R8: "Valorización de componentes procedentes de catalizadores"
R9: "Regeneración u otro nuevo empleo de aceites"
R10: "Tratamiento de suelos que produzca un beneficio a la agricultura o una mejora ecológica"
R11: "Utilización de residuos obtenidos a partir de las operaciones R1 a R10"
R12: "Intercambio de residuos para someterlos a operaciones R1 a R11"
R13: "Almacenamiento de residuos en espera de operaciones R1 a R12"
D1: "Depósito sobre el suelo o en su interior"
D2: "Tratamiento en medio terrestre"
D3: "Inyección en profundidad"
D4: "Embalse superficial"
D5: "Vertido en lugares especialmente diseñados"
D6: "Vertido en el medio acuático, salvo en el mar"
D7: "Vertido en el medio marino, incluida la inserción en el lecho marino"
D8: "Tratamiento biológico que dé como resultado compuestos o mezclas que se eliminen por D1 a D12"
D9: "Tratamiento fisicoquímico que dé como resultado compuestos o mezclas que se eliminen por D1 a D12"
D10: "Incineración en tierra"
D11: "Incineración en el mar"
D12: "Depósito permanente"
D13: "Combinación o mezcla previa a D1 a D12"
D14: "Reenvasado previo a D1 a D13"
D15: "Almacenamiento en espera de D1 a D14"
