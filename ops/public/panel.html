<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111318">
  <title>Palazzo Ops</title>
  <link rel="stylesheet" href="/panel/panel.css">
  <link rel="manifest" href="/panel/manifest.json">
  <script src="/panel/panel.js" defer></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1>Palazzo <span>Ops</span></h1>
      <p>Panel privado de tu tienda</p>
      <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Entrar</button>
      <p class="err" id="login-err" role="alert"></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="brand">Palazzo <span>Ops</span></div>
      <div class="top-actions">
        <span id="demo-badge" class="badge warn" hidden>DEMO</span>
        <button id="pause-btn" class="btn small" type="button">⏸ Pausar</button>
        <button id="alerts-btn" class="btn small ghost" type="button" aria-label="Alertas">🔔 <b id="alerts-count">0</b></button>
      </div>
    </header>
    <div id="paused-banner" class="banner" hidden>⏸ Automatizaciones en pausa: no se envían mensajes ni se actualiza Shopify.</div>

    <nav class="tabs" id="tabs">
      <button data-tab="setup">Puesta en marcha <b id="setup-count"></b></button>
      <button data-tab="resumen" class="on">Resumen</button>
      <button data-tab="pedidos">Pedidos</button>
      <button data-tab="aprobaciones">Aprobaciones <b id="ap-count"></b></button>
      <button data-tab="catalogo">Proveedor</button>
      <button data-tab="agentes">Agentes</button>
      <button data-tab="registro">Registro</button>
      <button data-tab="ajustes">Ajustes</button>
    </nav>

    <main id="view" class="view"></main>
  </div>

  <aside id="drawer" class="drawer" hidden aria-label="Detalle">
    <div class="drawer-inner">
      <button class="btn small ghost drawer-close" type="button" id="drawer-close">✕ Cerrar</button>
      <div id="drawer-body"></div>
    </div>
  </aside>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
